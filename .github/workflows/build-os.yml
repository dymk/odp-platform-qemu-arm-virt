# Builds the ODP Validation OS VHDX image on a Windows runner.
#
# SPDX-License-Identifier: MIT
#
# Downloads immutable pre-built driver assets, builds the dedicated UCSI smoke
# executable, injects both into a Validation OS WIM, converts it to VHDX, and
# uploads the result. The required drivers are listed in
# postbuild/os/prebuilt/driverlist.txt.
#
# Third-party actions are pinned by commit SHA.
#

name: build_os_image
run-name: build_os_image [${{ inputs.dispatch_nonce || github.run_id }}]

permissions:
  contents: read
  actions: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'postbuild/os/**'
      - 'mod/uefi/platform/QemuArmVirtPkg/AcpiTables/**'
      - '.github/workflows/build-os.yml'
  workflow_dispatch:
    inputs:
      validation_os_url:
        description: 'URL of the ARM64 ValidationOS ISO to download'
        required: false
        default: 'https://aka.ms/DownloadValidationOS_arm64'
        type: string
      drivers_repo:
        description: 'GitHub repository to download driver assets from (owner/repo)'
        required: false
        default: 'OpenDevicePartnership/odp-windows-drivers'
        type: string
      drivers_release:
        description: 'Driver release tag, or latest'
        required: false
        default: 'latest'
        type: string
      driver_asset_manifest:
        description: 'Immutable driver asset JSON generated by the E2E runner'
        required: false
        default: ''
        type: string
      dispatch_nonce:
        description: 'Unique safe token used to identify this dispatched run'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      git_ref:
        description: 'Git tag in vYYYY.MM.DD format'
        required: true
        type: string
      validation_os_url:
        description: 'URL of the ARM64 ValidationOS ISO to download'
        required: false
        default: 'https://aka.ms/DownloadValidationOS_arm64'
        type: string
      drivers_repo:
        description: 'GitHub repository to download driver assets from (owner/repo)'
        required: false
        default: 'OpenDevicePartnership/odp-windows-drivers'
        type: string
      drivers_release:
        description: 'Driver release tag, or latest'
        required: false
        default: 'latest'
        type: string
      driver_asset_manifest:
        description: 'Immutable driver asset JSON generated by the E2E runner'
        required: false
        default: ''
        type: string
      dispatch_nonce:
        description: 'Unique safe token used to identify this invocation'
        required: false
        default: ''
        type: string

concurrency:
  group: build_os_image-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    name: Build QEMU ARM64 OS image
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Clone Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Validate workflow inputs
        env:
          VALIDATION_OS_URL: ${{ inputs.validation_os_url || 'https://aka.ms/DownloadValidationOS_arm64' }}
          DRIVERS_REPO: ${{ inputs.drivers_repo || 'OpenDevicePartnership/odp-windows-drivers' }}
          DRIVERS_RELEASE: ${{ inputs.drivers_release || 'latest' }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce || '' }}
        run: |
          $repoPattern = '^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9][A-Za-z0-9._-]*$'
          $safeTokenPattern = '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'

          if ($env:DRIVERS_REPO -notmatch $repoPattern) {
            throw 'drivers_repo must be a safe OWNER/REPO value'
          }
          if ($env:DRIVERS_RELEASE -notmatch $safeTokenPattern) {
            throw 'drivers_release contains unsupported characters'
          }
          if ($env:DISPATCH_NONCE -and $env:DISPATCH_NONCE -notmatch $safeTokenPattern) {
            throw 'dispatch_nonce contains unsupported characters'
          }

          $validationOsUri = $null
          if (-not [Uri]::TryCreate(
              $env:VALIDATION_OS_URL,
              [UriKind]::Absolute,
              [ref]$validationOsUri
            ) -or $validationOsUri.Scheme -notin @('http', 'https')) {
            throw 'validation_os_url must be an absolute HTTP or HTTPS URL'
          }

      - name: Resolve driver assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIVERS_REPO: ${{ inputs.drivers_repo || 'OpenDevicePartnership/odp-windows-drivers' }}
          DRIVERS_RELEASE: ${{ inputs.drivers_release || 'latest' }}
          DRIVER_ASSET_MANIFEST: ${{ inputs.driver_asset_manifest || '' }}
        run: |
          $requiredNames = @(
            Get-Content -Path 'postbuild\os\prebuilt\driverlist.txt' |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith('#') } |
              ForEach-Object { "$_.zip" } |
              Sort-Object -Unique
          )

          if (-not $requiredNames) {
            throw 'No driver names found in postbuild\os\prebuilt\driverlist.txt'
          }

          if ($env:DRIVER_ASSET_MANIFEST) {
            try {
              $assets = @($env:DRIVER_ASSET_MANIFEST | ConvertFrom-Json)
            } catch {
              throw 'driver_asset_manifest must be valid JSON'
            }
          } else {
            $endpoint = "repos/$($env:DRIVERS_REPO)/releases/tags/$($env:DRIVERS_RELEASE)"
            $releaseJson = gh api $endpoint
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to resolve driver release $($env:DRIVERS_REPO)@$($env:DRIVERS_RELEASE)"
            }
            $release = $releaseJson | ConvertFrom-Json
            $assets = @(
              foreach ($name in $requiredNames) {
                $matches = @($release.assets | Where-Object { $_.name -eq $name })
                if ($matches.Count -ne 1) {
                  throw "Driver release must contain exactly one '$name' asset"
                }
                [pscustomobject]@{
                  name = $matches[0].name
                  id = $matches[0].id
                  digest = $matches[0].digest
                }
              }
            )
          }

          $assets = @($assets | Sort-Object name)
          if ($assets.Count -ne $requiredNames.Count) {
            throw 'Driver asset manifest does not contain exactly the required assets'
          }
          for ($index = 0; $index -lt $assets.Count; $index++) {
            $asset = $assets[$index]
            if ($asset.name -ne $requiredNames[$index]) {
              throw "Driver asset manifest mismatch: expected '$($requiredNames[$index])'"
            }
            if ($asset.name -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*\.zip$') {
              throw "Unsafe driver asset name '$($asset.name)'"
            }
            if ($asset.id -isnot [long] -and $asset.id -isnot [int]) {
              throw "Driver asset '$($asset.name)' has an invalid ID"
            }
            if ([long]$asset.id -le 0) {
              throw "Driver asset '$($asset.name)' has an invalid ID"
            }
            if ($asset.digest -notmatch '^sha256:[0-9a-fA-F]{64}$') {
              throw "Driver asset '$($asset.name)' has no valid SHA-256 digest"
            }
            $asset.digest = $asset.digest.ToLowerInvariant()
          }

          $manifestJson = ConvertTo-Json -InputObject @($assets) -Compress
          "DRIVER_ASSET_MANIFEST_JSON=$manifestJson" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download driver assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIVERS_REPO: ${{ inputs.drivers_repo || 'OpenDevicePartnership/odp-windows-drivers' }}
        run: |
          $assets = @($env:DRIVER_ASSET_MANIFEST_JSON | ConvertFrom-Json)
          $headers = @{
            Accept = 'application/octet-stream'
            Authorization = "Bearer $($env:GH_TOKEN)"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          foreach ($asset in $assets) {
            $driverName = [IO.Path]::GetFileNameWithoutExtension($asset.name)
            $destPath = Join-Path 'drivers' $driverName
            New-Item -ItemType Directory -Path $destPath -Force | Out-Null

            $zipPath = Join-Path $env:RUNNER_TEMP $asset.name
            if (Test-Path $zipPath) { Remove-Item -Path $zipPath -Force }

            $assetUri = "https://api.github.com/repos/$($env:DRIVERS_REPO)/releases/assets/$($asset.id)"
            Write-Host "Downloading immutable asset ID $($asset.id): $($asset.name)"
            Invoke-WebRequest -Uri $assetUri -Headers $headers -OutFile $zipPath

            $actualDigest = "sha256:$((Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ($actualDigest -ne $asset.digest) {
              throw "SHA-256 mismatch for '$($asset.name)'"
            }

            Expand-Archive -Path $zipPath -DestinationPath $destPath -Force
          }

      - name: Download Validation OS ISO
        env:
          VALIDATION_OS_URL: ${{ inputs.validation_os_url || 'https://aka.ms/DownloadValidationOS_arm64' }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $isoUrl = $env:VALIDATION_OS_URL
          Write-Host 'Downloading Validation OS ISO'
          Invoke-WebRequest $isoUrl -OutFile 'ValidationOS.iso'

      - name: Build UCSI smoke app
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target aarch64-pc-windows-msvc
          cargo +1.90.0 build --locked --release --target aarch64-pc-windows-msvc --manifest-path postbuild/os/ucsi-smoke/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "UCSI smoke build failed with exit code $LASTEXITCODE" }
          $app = Resolve-Path 'postbuild\os\ucsi-smoke\target\aarch64-pc-windows-msvc\release\ucsi-smoke.exe'
          "UCSI_SMOKE_APP=$app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build WIM
        run: |
          $mount = Mount-DiskImage -ImagePath (Resolve-Path ValidationOS.iso).Path -PassThru
          $drive = ($mount | Get-Volume).DriveLetter
          try {
            cmd /c "${drive}:\GenImage\GenImage.cmd -PackagesList:postbuild\os\prebuilt\armvirt_config.pkg -PackagePath:${drive}:\cabs -ImagePath:${drive}:\ -RegistryImport:postbuild\os\prebuilt\armvirt_policy.reg -OutPath:postbuild\os\build -wim -NoWait"
            if ($LASTEXITCODE -ne 0) { throw "GenImage.cmd failed with exit code $LASTEXITCODE" }

            $wim = Get-ChildItem -Path 'postbuild\os\build' -Filter *.wim -File | Select-Object -First 1
            if (-not $wim) { throw 'GenImage produced no .wim in postbuild\os\build' }
            "WIM_PATH=$($wim.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally {
            Dismount-DiskImage -ImagePath $mount.ImagePath
          }

      - name: Build ACPITABL.dat
        run: |
          # iasl ships as an edk2 NuGet external-dependency that is not present in a
          # fresh checkout (the patina-qemu submodule does not commit extdep binaries).
          # Use the bundled copy if it exists, otherwise download the same pinned
          # version of the ACPICA iasl compiler from the public projectmu NuGet feed.
          $iaslDir = 'mod\uefi\patina-qemu\MU_BASECORE\BaseTools\Bin\edk2-acpica-iasl_extdep\Windows-x86'
          if (Test-Path (Join-Path $iaslDir 'iasl.exe')) {
            $iaslDir = (Resolve-Path $iaslDir).Path
          } else {
            $iaslVersion = '20230628.0.1'
            $iaslUrl = "https://pkgs.dev.azure.com/projectmu/acpica/_packaging/mu_iasl/nuget/v3/flat2/edk2-acpica-iasl/$iaslVersion/edk2-acpica-iasl.$iaslVersion.nupkg"
            $iaslRoot = Join-Path $env:RUNNER_TEMP 'iasl'
            $iaslZip = Join-Path $env:RUNNER_TEMP 'edk2-acpica-iasl.zip'
            Write-Host "Bundled iasl not found; downloading $iaslUrl"
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest -Uri $iaslUrl -OutFile $iaslZip
            if (Test-Path $iaslRoot) { Remove-Item -Path $iaslRoot -Recurse -Force }
            Expand-Archive -Path $iaslZip -DestinationPath $iaslRoot -Force
            $iaslDir = Join-Path $iaslRoot 'edk2-acpica-iasl\Windows-x86'
            if (-not (Test-Path (Join-Path $iaslDir 'iasl.exe'))) {
              throw "iasl.exe not found after extracting $iaslUrl"
            }
            $iaslDir = (Resolve-Path $iaslDir).Path
          }
          "PATH=$iaslDir;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:PATH = "$iaslDir;$env:PATH"

          iasl -v
          if ($LASTEXITCODE -ne 0) { throw "iasl verification failed with exit code $LASTEXITCODE" }

          $scriptPath = 'mod\uefi\platform\QemuArmVirtPkg\AcpiTables\build_acpi_tables.ps1'
          if (-not (Test-Path $scriptPath)) {
            throw "Missing ACPI build script: $scriptPath"
          }

          & $scriptPath
          if ($LASTEXITCODE -ne 0) { throw "ACPI build script failed with exit code $LASTEXITCODE" }

          if (-not $env:ACPITABL_DAT_PATH) {
            throw 'ACPITABL_DAT_PATH was not exported by build_acpi_tables.ps1'
          }

          if (-not (Test-Path $env:ACPITABL_DAT_PATH)) {
            throw "ACPITABL.dat does not exist at $env:ACPITABL_DAT_PATH"
          }

      - name: Inject QEMU drivers into WIM
        run: |
          if (-not $env:WIM_PATH) {
            throw 'WIM_PATH is not set'
          }

          $wimPath = Resolve-Path $env:WIM_PATH
          $mountPath = Join-Path $env:RUNNER_TEMP 'os-image-mount'

          if (Test-Path $mountPath) {
            Remove-Item -Path $mountPath -Recurse -Force
          }

          New-Item -ItemType Directory -Path $mountPath -Force | Out-Null

          $assets = @($env:DRIVER_ASSET_MANIFEST_JSON | ConvertFrom-Json)
          $driverRoots = $assets | ForEach-Object {
            Resolve-Path (Join-Path 'drivers' ([IO.Path]::GetFileNameWithoutExtension($_.name)))
          }

          if (-not $driverRoots) {
            throw 'No driver paths resolved from the immutable driver manifest'
          }

          $infPaths = foreach ($driverRoot in $driverRoots) {
            Get-ChildItem -Path $driverRoot -Recurse -Filter *.inf -File
          }

          if (-not $infPaths) {
            throw "No INF files found for any driver listed in $env:DRIVER_ASSET_NAMES_FILE"
          }

          $infPaths = $infPaths | Sort-Object FullName -Unique

          try {
            dism.exe /Mount-Image /ImageFile:$wimPath /Index:1 /MountDir:$mountPath
            if ($LASTEXITCODE -ne 0) { throw "Failed to mount WIM with exit code $LASTEXITCODE" }

            foreach ($infPath in $infPaths) {
              Write-Host "Injecting driver $($infPath.FullName)"
              dism.exe /Image:$mountPath /Add-Driver /Driver:$($infPath.FullName) /ForceUnsigned
              if ($LASTEXITCODE -ne 0) { throw "Failed to add driver $($infPath.FullName) with exit code $LASTEXITCODE" }
            }

            dism.exe /Unmount-Image /MountDir:$mountPath /Commit
            if ($LASTEXITCODE -ne 0) { throw "Failed to commit WIM changes with exit code $LASTEXITCODE" }
          } finally {
            $mountedImage = Get-WindowsImage -Mounted | Where-Object { $_.Path -eq $mountPath }
            if ($mountedImage) {
              dism.exe /Unmount-Image /MountDir:$mountPath /Discard | Out-Null
            }

            if (Test-Path $mountPath) {
              Remove-Item -Path $mountPath -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Convert WIM to VHDX
        run: |
          if (-not $env:WIM_PATH) {
            throw 'WIM_PATH is not set'
          }

          $wimPath = Resolve-Path $env:WIM_PATH
          $vhdxPath = Join-Path (Get-Location) 'staging\os-image.vhdx'
          $vhdxSizeBytes = 2GB

          New-Item -ItemType Directory -Force -Path staging | Out-Null

          $vhdx = New-VHD -Path $vhdxPath -SizeBytes $vhdxSizeBytes -Dynamic
          $disk = Mount-VHD -Path $vhdxPath -Passthru
          try {
            $disk | Initialize-Disk -PartitionStyle GPT

            $efiPart = $disk | New-Partition -Size 100MB -GptType '{c12a7328-f81f-11d2-ba4b-00a0c93ec93b}' -AssignDriveLetter
            $efiPart | Format-Volume -FileSystem FAT32 -NewFileSystemLabel 'EFI' -Confirm:$false | Out-Null
            $efiLetter = $efiPart.DriveLetter

            $osPart = $disk | New-Partition -UseMaximumSize -GptType '{ebd0a0a2-b9e5-4433-87c0-68b6b72699c7}' -AssignDriveLetter
            $osPart | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ValidationOS' -Confirm:$false | Out-Null
            $osLetter = $osPart.DriveLetter

            Write-Host "EFI partition: ${efiLetter}:  OS partition: ${osLetter}:"

            Write-Host "Applying WIM to ${osLetter}:\"
            dism.exe /Apply-Image /ImageFile:"$wimPath" /Index:1 /ApplyDir:"${osLetter}:\"
            if ($LASTEXITCODE -ne 0) { throw "Failed to apply WIM with exit code $LASTEXITCODE" }

            if (-not $env:ACPITABL_DAT_PATH) {
              throw 'ACPITABL_DAT_PATH is not set'
            }

            $acpiTargetDir = "${osLetter}:\Windows\System32"
            New-Item -Path $acpiTargetDir -ItemType Directory -Force | Out-Null
            Copy-Item -Path $env:ACPITABL_DAT_PATH -Destination (Join-Path $acpiTargetDir 'ACPITABL.dat') -Force
            Write-Host "Copied ACPITABL.dat to ${acpiTargetDir}"

            if (-not $env:UCSI_SMOKE_APP -or -not (Test-Path $env:UCSI_SMOKE_APP)) {
              throw 'UCSI_SMOKE_APP is missing'
            }
            $smokeDir = "${osLetter}:\ucsi-smoke"
            New-Item -Path $smokeDir -ItemType Directory -Force | Out-Null
            Copy-Item -Path $env:UCSI_SMOKE_APP -Destination (Join-Path $smokeDir 'ucsi-smoke.exe') -Force
            Write-Host "Copied UCSI smoke executable to ${smokeDir}"

            Write-Host "Creating boot files on ${efiLetter}:\"
            bcdboot "${osLetter}:\Windows" /s "${efiLetter}:" /f UEFI
            if ($LASTEXITCODE -ne 0) { throw "bcdboot failed with exit code $LASTEXITCODE" }

            Write-Host "Enabling testsigning"
            bcdedit /store ${efiLetter}:\EFI\Microsoft\Boot\BCD /set "{default}" testsigning on
            if ($LASTEXITCODE -ne 0) { throw "Enabling testsigning failed with exit code $LASTEXITCODE" }

            Write-Host "Enabling debug"
            bcdedit /store ${efiLetter}:\EFI\Microsoft\Boot\BCD /set "{default}" debug on
            if ($LASTEXITCODE -ne 0) { throw "Enabling debug failed with exit code $LASTEXITCODE" }
          } finally {
            Dismount-VHD -Path $vhdxPath
          }

          Write-Host "VHDX created: $vhdxPath ($('{0:N1} MB' -f ((Get-Item $vhdxPath).Length / 1MB)))"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: os-image
          path: staging/os-image.vhdx
          retention-days: 14
          if-no-files-found: error
